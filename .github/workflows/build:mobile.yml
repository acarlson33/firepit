name: Mobile Android Build

on:
    workflow_dispatch:
    schedule:
        - cron: "0 8 * * 0"

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/mobile

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.0"

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - name: Cache Gradle
              uses: actions/cache@v4
              with:
                  path: ~/.gradle/caches
                  key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-

            - name: Update dependencies and lockfile
              run: |
                  npm update
                  bun install

            - name: Type check
              run: npx -p typescript tsc --noEmit

            - name: Prebuild (generate android directory)
              run: npx expo prebuild --platform android --clean
              env:
                  APP_ENV: production
                  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

            - name: Patch Sentry Gradle plugin to v6.14.0
              run: |
                  node -e "
                  const fs = require('fs');

                  // Convert app/build.gradle: replace apply plugin: lines with plugins {} block
                  // and add io.sentry.android.gradle v6.14.0
                  let app = fs.readFileSync('android/app/build.gradle', 'utf8');

                  const topLines = app.match(/^apply plugin: \"[^\"]+\"\napply plugin: \"[^\"]+\"\napply plugin: \"[^\"]+\"\n/m);
                  if (topLines) {
                    const plugins = topLines[0].trim().split('\n').map(l =>
                      l.replace(/^apply plugin: \"(.+)\"$/, '    id(\"\$1\")')
                    );
                    plugins.push('    id(\"io.sentry.android.gradle\") version \"6.14.0\"');
                    const block = 'plugins {\n' + plugins.join('\n') + '\n}\n\n';
                    app = app.replace(topLines[0], block);
                    fs.writeFileSync('android/app/build.gradle', app);
                    console.log('Patched app/build.gradle — plugins block + sentry 6.14.0');
                  }
                  "

            - name: Android release build
              run: ./gradlew assembleRelease
              working-directory: apps/mobile/android
              env:
                  APP_ENV: production

            - name: Upload APK
              uses: actions/upload-artifact@v4
              with:
                  name: firepit-android-production
                  path: apps/mobile/android/app/build/outputs/apk/release/*.apk
                  if-no-files-found: warn
